name: Monitoring runtime
on:
  workflow_dispatch:
  push:
    paths:
      - 'k8s/monitoring/**'
      - 'services/api/**'
      - 'scripts/monitoring/**'
      - 'scripts/test/test-monitoring.py'
      - 'scripts/test/test-database-outage.sh'
      - '.github/workflows/monitoring-runtime.yaml'
permissions:
  contents: read
jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: helm/kind-action@v1
        with:
          version: v0.31.0
          node_image: kindest/node:v1.35.0
          cluster_name: kind
      - name: Build and deploy application
        run: bash scripts/kind.sh
      - name: Provision private test credentials
        env:
          KUBE_CONTEXT: kind-kind
          APP_NAMESPACE: demo-dev
        run: |
          credentials_dir=$(mktemp -d)
          trap 'rm -rf "$credentials_dir"' EXIT
          python3 - "$credentials_dir" <<'PY'
          from pathlib import Path
          import os, secrets, sys
          for name in ('grafana-password', 'postgres-monitoring-password'):
              p = Path(sys.argv[1]) / name
              p.write_text(secrets.token_urlsafe(32))
              os.chmod(p, 0o600)
          PY
          kubectl --context=kind-kind create namespace monitoring
          kubectl --context=kind-kind -n monitoring create secret generic grafana-admin \
            --from-literal=admin-user=admin --from-file="admin-password=$credentials_dir/grafana-password"
          bash scripts/monitoring/create-db-monitoring-role.sh "$credentials_dir/postgres-monitoring-password"
      - name: Install pinned observability stack
        env:
          KUBE_CONTEXT: kind-kind
          APP_NAMESPACE: demo-dev
        run: bash scripts/monitoring/install.sh
      - name: Metrics, logs, and dashboard integration checks
        env:
          KUBE_CONTEXT: kind-kind
          APP_NAMESPACE: demo-dev
        run: python3 scripts/test/test-monitoring.py
      - name: Alert firing, recovery, and data-preservation exercise
        env:
          KUBE_CONTEXT: kind-kind
          APP_NAMESPACE: demo-dev
        run: python3 scripts/monitoring/exercise.py
      - name: Diagnostics without Secret values
        if: failure()
        run: |
          kubectl --context=kind-kind get pods -A
          kubectl --context=kind-kind -n monitoring get events --sort-by=.lastTimestamp
          kubectl --context=kind-kind -n demo-dev get events --sort-by=.lastTimestamp
          kubectl --context=kind-kind -n demo-dev logs deployment/api --tail=50 || true
          kubectl --context=kind-kind -n monitoring logs statefulset/loki --tail=50 || true
