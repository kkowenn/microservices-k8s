name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: API tests and vet
        working-directory: services/api
        run: |
          go test -race -count=1 ./...
          go vet ./...
      - name: Frontend regression tests
        run: node --test services/web/*.test.js
      - name: Install manifest test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          curl -fsSLO https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl
          curl -fsSLO https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl.sha256
          printf '%s  kubectl\n' "$(cat kubectl.sha256)" | sha256sum -c -
          chmod +x kubectl
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Manifest and shell checks
        run: |
          python -m unittest discover -s tests -v
          for script in scripts/*.sh scripts/test/*.sh; do bash -n "$script"; done
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          version: v0.31.0
          node_image: kindest/node:v1.35.0
          cluster_name: kind
      - name: Build and deploy local app
        run: bash scripts/kind.sh
      - name: Functional smoke test
        run: bash scripts/test/smoke.sh
      - name: Backup and restore test
        run: bash scripts/test/test-backup-job.sh
      - name: Database outage and recovery test
        env:
          KUBE_CONTEXT: kind-kind
          NAMESPACE: demo-dev
        run: bash scripts/test/test-database-outage.sh
      - name: Diagnostics
        if: failure()
        run: |
          kubectl --context=kind-kind -n demo-dev get pods,pvc
          kubectl --context=kind-kind -n demo-dev get events --sort-by=.lastTimestamp
