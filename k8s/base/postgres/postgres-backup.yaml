apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  namespace: demo
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: demo
spec:
  # Run daily at 02:00 Bangkok time
  schedule: "0 2 * * *"
  timeZone: Asia/Bangkok

  # Test with a manual Job before setting this to false
  suspend: true

  # Prevent overlapping scheduled Jobs from this CronJob
  concurrencyPolicy: Forbid

  # Retain Job history; these settings do not delete backup files
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600

      template:
        spec:
          serviceAccountName: postgres-backup
          restartPolicy: Never
          automountServiceAccountToken: false

          containers:
          - name: postgres-backup
            image: postgres:16-alpine
            imagePullPolicy: IfNotPresent

            envFrom:
            - secretRef:
                name: postgres-credentials

            env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: RETENTION_MINUTES
              value: "10080" # 7 days

            command:
            - /bin/sh
            - -c
            - |
              set -eu
              umask 077

              # Map Secret variables to PostgreSQL client variables
              export PGUSER="$POSTGRES_USER"
              export PGPASSWORD="$POSTGRES_PASSWORD"
              export PGDATABASE="$POSTGRES_DB"

              # Use UTC timestamps and the Pod hostname for unique filenames
              timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
              filename="${PGDATABASE}-${timestamp}-${HOSTNAME}.tar"
              backup="/backups/$filename"
              partial="${backup}.partial"

              # 1. Write the backup to a temporary file
              echo "Starting backup: $filename"

              pg_dump \
                --no-password \
                --format=tar \
                --file="$partial"

              # 2. Rename the file only after pg_dump succeeds
              mv "$partial" "$backup"

              echo "Backup completed: $filename"

              # 3. Remove expired backups only after a new backup succeeds
              # Exclude partial files and the backup created by this Job
              echo "Cleaning backups older than $RETENTION_MINUTES minutes"

              find /backups \
                -maxdepth 1 \
                -type f \
                -name "${PGDATABASE}-*.tar" \
                ! -name "$filename" \
                -mmin "+${RETENTION_MINUTES}" \
                -print \
                -exec rm -f {} \;

              echo "Housekeeping completed"

            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi

            volumeMounts:
            - name: backup-volume
              mountPath: /backups

          volumes:
          - name: backup-volume
            persistentVolumeClaim:
              claimName: postgres-backups
