apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-cluster
  namespace: demo
  labels:
    app: cnpg-cluster
spec:
  instances: 2

  storage:
    size: 1Gi

  bootstrap:
    initdb:
      database: demodb
      owner: demouser
      postInitSQL:
        - |
          CREATE TABLE IF NOT EXISTS items (
            id SERIAL PRIMARY KEY,
            name VARCHAR(255) NOT NULL,
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
        - |
          INSERT INTO items (name) VALUES ('Item A'), ('Item B'), ('Item C')
          ON CONFLICT DO NOTHING;

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
