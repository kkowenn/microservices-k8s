apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-staging

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

images:
  - name: api
    newName: registry.example.com/api
    newTag: staging
  - name: web
    newName: registry.example.com/web
    newTag: staging
  - name: postgres
    newName: postgres
    newTag: "16-alpine"
