apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-dev

resources:
- ../../base

replicas:
- name: api
  count: 1
- name: web
  count: 1
- name: nginx
  count: 1
# These PostgreSQL containers do not configure replication. # backup pod  postgresql should be 1 just easier practice
- name: postgres
  count: 1

images:
- name: api
  newTag: local
- name: web
  newTag: local

patches:
- target:
    kind: Deployment
    name: api
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Never
- target:
    kind: Deployment
    name: web
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Never
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: /api
