apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-dev

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

images:
  - name: api
    newName: localhost:5000/api
    newTag: dev
  - name: web
    newName: localhost:5000/web
    newTag: dev
  - name: postgres
    newName: postgres
    newTag: "16-alpine"
