apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-dev

resources:
  - ../../base
  - ../../base/cnpg

patches:
  # Use CNPG secret for API env vars instead of manual postgres-credentials
  - path: ../../base/cnpg/api-env-patch.yaml
  # Scale down for dev
  - target:
      kind: Deployment
      name: api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  # Scale CNPG to 1 instance for dev
  - target:
      kind: Cluster
      name: cnpg-cluster
    patch: |
      - op: replace
        path: /spec/instances
        value: 1

images:
  - name: api
    newName: localhost:5000/api
    newTag: dev
  - name: web
    newName: localhost:5000/web
    newTag: dev
