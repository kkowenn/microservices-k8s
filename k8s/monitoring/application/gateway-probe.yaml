apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-probe-config
data:
  blackbox.yaml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          valid_status_codes: [200]
          follow_redirects: false
          preferred_ip_protocol: ip4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-probe
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway-probe}
  template:
    metadata:
      labels: {app: gateway-probe}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534}
      containers:
        - name: blackbox
          image: prom/blackbox-exporter:v0.26.0
          args: ['--config.file=/etc/blackbox/blackbox.yaml']
          ports: [{name: http, containerPort: 9115}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /-/healthy, port: http}
          volumeMounts: [{name: config, mountPath: /etc/blackbox, readOnly: true}]
      volumes:
        - name: config
          configMap: {name: gateway-probe-config}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-probe
  labels: {app: gateway-probe}
spec:
  selector: {app: gateway-probe}
  ports: [{name: http, port: 9115, targetPort: http}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gateway-availability
  labels: {monitoring: demo-observability}
spec:
  selector:
    matchLabels: {app: gateway-probe}
  endpoints:
    - port: http
      path: /probe
      interval: 15s
      scrapeTimeout: 10s
      params:
        module: [http_2xx]
        # Relative DNS resolves within the exporter's own application namespace.
        target: ['http://nginx/api/items']
